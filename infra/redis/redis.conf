# Redis Configuration for Reactive Ticketing Platform
# Port & network
port 6379
bind 0.0.0.0
protected-mode no

# Memory & Keyspace Notifications (Critical for Ticket Lock Expiration)
# 'KEx' allows capturing keyevent events for expired keys: __keyevent@0__:expired
notify-keyspace-events "KEx"

# Persistence settings
appendonly yes
appendfsync everysec

# Concurrency & TCP
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory management
maxmemory 512mb
maxmemory-policy volatile-lru
