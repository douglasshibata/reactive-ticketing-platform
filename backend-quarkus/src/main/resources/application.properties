# Quarkus Configuration - Reactive Ticketing Platform
quarkus.application.name=reactive-ticketing-backend
quarkus.http.port=8080

# Database settings (PostgreSQL Reactive Client)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.reactive.url=postgresql://localhost:5432/ticketing_db
quarkus.hibernate-orm.database.generation=update

# Redis Settings
quarkus.redis.hosts=redis://localhost:6379

# Kafka Messaging Channels
kafka.bootstrap.servers=localhost:9092

# Outgoing Kafka channel for ticket reservations
mp.messaging.outgoing.ticket-reserved-out.connector=smallrye-kafka
mp.messaging.outgoing.ticket-reserved-out.topic=ticket.reserved
mp.messaging.outgoing.ticket-reserved-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Outgoing Kafka channel for completed ticket purchases
mp.messaging.outgoing.ticket-paid-out.connector=smallrye-kafka
mp.messaging.outgoing.ticket-paid-out.topic=ticket.paid
mp.messaging.outgoing.ticket-paid-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Incoming Kafka channel for asynchronous fulfillment / background tickets
mp.messaging.incoming.ticket-paid-in.connector=smallrye-kafka
mp.messaging.incoming.ticket-paid-in.topic=ticket.paid
mp.messaging.incoming.ticket-paid-in.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.ticket-paid-in.auto.offset.reset=earliest

# Outgoing Kafka channel for VOD Ready Events (Jibri -> Quarkus -> Kafka -> n8n)
mp.messaging.outgoing.vod-ready.connector=smallrye-kafka
mp.messaging.outgoing.vod-ready.topic=events.vod.ready
mp.messaging.outgoing.vod-ready.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Webhook Jibri Security
webhook.jibri.secret=${WEBHOOK_JIBRI_SECRET:default_dev_secret_only}

# AWS S3 Configuration for VOD Pre-signed URLs
aws.s3.vod.bucket-name=empresa-vod-archive-prd
quarkus.s3.aws.region=sa-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY:dev_access_key}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_KEY:dev_secret_key}

# SmallRye JWT Settings
mp.jwt.verify.issuer=https://auth.ticket.com/realms/ticket

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."com.ticket".level=DEBUG

# 1. Prometheus Metrics Configuration (/q/metrics)
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# 2. OpenTelemetry & Jaeger Distributed Tracing
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.traces.protocol=grpc
quarkus.otel.enabled=true

# 3. Metric instrumentation for Kafka & Hibernate
quarkus.hibernate-orm.metrics.enabled=true
quarkus.kafka.metrics.enabled=true

# DevServices disabled for predictable test environments
quarkus.devservices.enabled=false

# Test profile overrides
%test.quarkus.hibernate-orm.active=false
%test.quarkus.devservices.enabled=false
%test.quarkus.reactive-pg-client.active=false
%test.quarkus.otel.enabled=false
%test.mp.messaging.outgoing.ticket-reserved-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.ticket-paid-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.ticket-paid-in.connector=smallrye-in-memory
%test.mp.messaging.outgoing.vod-ready.connector=smallrye-in-memory
%test.quarkus.s3.devservices.enabled=false
%test.quarkus.smallrye-jwt.enabled=false
